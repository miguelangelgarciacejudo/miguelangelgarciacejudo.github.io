<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to xxxx.github.io</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin-bottom: 2rem;
    }

    a.button {
      text-decoration: none;
      background-color: #ffffff;
      color: #1e3c72;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s ease;
    }

    a.button:hover {
      background-color: #e2e8f0;
    }

    footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>Welcome to miguelangelgarciacejudo.github.io</h1>
  <p>This is your personal or project website hosted with GitHub Pages. Feel free to customize this page!</p>
  <a class="button" href="https://github.com/miguelangelgarciacejudo">Visit my GitHub</a>

  <footer>
    &copy; 2025 miguelangelgarciacejudo. All rights reserved.
  </footer>
</body>
</html>
